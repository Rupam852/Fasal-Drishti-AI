services:
  - type: web
    name: fasal-drishti-ml-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: MODEL_PATH
        value: "model_4_mobilenet_finetuned.keras"
